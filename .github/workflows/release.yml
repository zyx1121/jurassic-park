name: Release

on:
  push:
    tags: ['v*.*.*']

# macOS builds are produced locally with `unity build . --target StandaloneOSX` until a
# macOS runner is registered; attach them to the release by hand.
jobs:
  windows:
    name: Windows build
    runs-on: [self-hosted, windows, unity]
    timeout-minutes: 90
    env:
      UNITY_NON_INTERACTIVE: '1'
      UNITY_NO_BANNER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build
        shell: powershell
        run: unity build . --target StandaloneWindows64 --output-path Builds/Windows/JurassicPark.exe --no-tail
      - name: Archive
        shell: powershell
        run: Compress-Archive -Path Builds\Windows\* -DestinationPath "jurassic-park-${{ github.ref_name }}-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: jurassic-park-*.zip

  publish:
    needs: windows
    runs-on: [self-hosted, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: jurassic-park-*.zip
          generate_release_notes: true
