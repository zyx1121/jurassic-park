name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: No generated folders committed
        run: |
          set -e
          for d in Library Temp Obj Logs UserSettings Builds; do
            if git ls-files | grep -q "^$d/"; then echo "::error::$d/ is committed"; exit 1; fi
          done
      - name: Every asset has a .meta and every .meta has an asset
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            [ -e "$f.meta" ] || { echo "::error::missing meta for $f"; fail=1; }
          done < <(git ls-files 'Assets/**' | grep -v '\.meta$')
          while IFS= read -r m; do
            [ -e "${m%.meta}" ] || { echo "::error::orphan meta $m"; fail=1; }
          done < <(git ls-files 'Assets/**/*.meta' 'Assets/*.meta')
          exit $fail
      - name: Binary assets are LFS pointers
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! git check-attr filter -- "$f" | grep -q 'lfs'; then echo "::error::$f not tracked by LFS"; fail=1; fi
          done < <(git ls-files | grep -Ei '\.(png|jpg|psd|aseprite|fbx|obj|blend|wav|mp3|ogg|ttf|otf|exr|hdr|mp4)$' || true)
          exit $fail

  unity:
    name: Unity tests and Windows build
    # Self-hosted runner on king (Windows 11, RTX 3080) with Unity 6000.3.24f1 licensed.
    runs-on: [self-hosted, windows, unity]
    needs: hygiene
    timeout-minutes: 60
    env:
      UNITY_EXE: E:\Unity\Editors\6000.3.24f1\Editor\Unity.exe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: EditMode tests
        shell: pwsh
        run: |
          & $env:UNITY_EXE -batchmode -nographics -projectPath "$PWD" -runTests -testPlatform EditMode -testResults "$PWD\TestResults\editmode.xml" -logFile "$PWD\Logs\ci-editmode.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$PWD\Logs\ci-editmode.log" -Tail 80; exit $LASTEXITCODE }
      - name: Windows build
        shell: pwsh
        run: |
          & $env:UNITY_EXE -batchmode -nographics -quit -projectPath "$PWD" -executeMethod Build.CI.BuildWindows -logFile "$PWD\Logs\ci-build.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$PWD\Logs\ci-build.log" -Tail 80; exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-and-logs
          path: |
            Builds/Windows/**
            TestResults/**
            Logs/ci-*.log
          retention-days: 7
