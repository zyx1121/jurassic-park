name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene
    # GitHub-hosted runners are blocked on this account's billing; run on king.
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: No generated folders committed
        shell: powershell
        run: |
          $files = git ls-files
          $bad = $files | Where-Object { $_ -match '^(Library|Temp|Obj|Logs|UserSettings|Builds)/' }
          if ($bad) { $bad | ForEach-Object { Write-Host "::error::$_ is committed" }; exit 1 }
      - name: Every asset has a .meta and every .meta has an asset
        shell: powershell
        run: |
          $files = git ls-files 'Assets/**'
          $fail = $false
          # Unity ignores dot-prefixed and tilde-suffixed files, so they need no .meta
          foreach ($f in $files | Where-Object { $_ -notmatch '\.meta$' -and ($_ -split '/')[-1] -notmatch '^\.|~$' }) {
            if (-not (Test-Path -LiteralPath "$f.meta")) { Write-Host "::error::missing meta for $f"; $fail = $true }
          }
          foreach ($m in $files | Where-Object { $_ -match '\.meta$' }) {
            $target = $m -replace '\.meta$', ''
            if (-not (Test-Path -LiteralPath $target)) { Write-Host "::error::orphan meta $m"; $fail = $true }
          }
          if ($fail) { exit 1 }
      - name: Binary assets are LFS pointers
        shell: powershell
        run: |
          $bins = git ls-files | Where-Object { $_ -match '\.(png|jpg|psd|aseprite|fbx|obj|blend|wav|mp3|ogg|ttf|otf|exr|hdr|mp4)$' }
          $fail = $false
          foreach ($f in $bins) {
            $attr = git check-attr filter -- $f
            if ($attr -notmatch 'lfs') { Write-Host "::error::$f not tracked by LFS"; $fail = $true }
          }
          if ($fail) { exit 1 }

  unity:
    name: Unity tests and Windows build
    # Self-hosted runner on king (Windows 11, RTX 3080) with Unity 6000.3.24f1 licensed.
    runs-on: [self-hosted, windows, unity]
    needs: hygiene
    timeout-minutes: 60
    env:
      UNITY_EXE: E:\Unity\Editors\6000.3.24f1\Editor\Unity.exe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: EditMode tests
        shell: powershell
        run: |
          & $env:UNITY_EXE -batchmode -nographics -projectPath "$PWD" -runTests -testPlatform EditMode -testResults "$PWD\TestResults\editmode.xml" -logFile "$PWD\Logs\ci-editmode.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$PWD\Logs\ci-editmode.log" -Tail 80; exit $LASTEXITCODE }
      - name: Windows build
        shell: powershell
        run: |
          & $env:UNITY_EXE -batchmode -nographics -quit -projectPath "$PWD" -executeMethod Build.CI.BuildWindows -logFile "$PWD\Logs\ci-build.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$PWD\Logs\ci-build.log" -Tail 80; exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-and-logs
          path: |
            Builds/Windows/**
            TestResults/**
            Logs/ci-*.log
          retention-days: 7
